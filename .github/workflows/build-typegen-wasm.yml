name: Build Code Generation WASM Plugin

# Manual trigger from the GitHub UI
on:
  workflow_dispatch:
    inputs:
      lang:
        description: "lang (e.g., java, rust)"
        required: true
        type: string

jobs:
  build-wasm:
    name: Build WASM (wasm32-wasip1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Add wasm32-wasip1 target
        run: rustup target add wasm32-wasip1

      - name: Run Tests
        run: cargo test --package typegen-${{ github.event.inputs.lang }} -- --nocapture

      - name: Build wasm32-wasip1
        run: cargo build --package typegen-${{ github.event.inputs.lang }} --profile wasm --target wasm32-wasip1

      - name: Rename binary
        run: mv target/wasm32-wasip1/wasm/typegen-${{ github.event.inputs.lang }}.wasm typegen-${{ github.event.inputs.lang }}-wasm32-wasip1.wasm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: typegen-${{ github.event.inputs.lang }}-wasm32-wasip1
          path: typegen-${{ github.event.inputs.lang }}-wasm32-wasip1.wasm
