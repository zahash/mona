name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Setup auth database
        run: |
          export DATABASE_URL="sqlite:///tmp/data.db";
          sqlx database setup --source auth/server/migrations;

      - name: Run Tests
        run: cargo test --workspace --all-features --no-fail-fast -- --nocapture
